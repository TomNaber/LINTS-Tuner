<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8f6"><title>LINTS Tuner</title>
<style>
:root{color-scheme:light;font:16px system-ui,sans-serif;color:#202723;background:#f7f8f6;accent-color:#32634e}*{box-sizing:border-box}body{margin:0}main{max-width:660px;margin:60px auto;padding:0 24px 40px}h1{font-size:24px;letter-spacing:-.7px;font-weight:600;margin:0 0 28px}button{font:inherit;cursor:pointer}label,.label{display:block;font-size:14px;font-weight:500}.row{margin:26px 0}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.value{display:flex;align-items:center;gap:8px;font-size:13px;color:#69736c}input[type=number]{font:inherit;font-size:15px;width:90px;padding:7px 8px;border:1px solid #d8ded9;border-radius:5px;background:#fff;color:#202723;text-align:right}input[type=range]{width:100%;margin:6px 0;cursor:pointer;min-height:24px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices button{border:1px solid #d8ded9;border-radius:5px;padding:8px 16px;background:transparent;font-size:14px}.choices button[aria-pressed=true]{background:#e4ede6;border-color:#557b64;color:#244f3c}figure{margin:30px 0 24px}canvas{display:block;width:100%;height:200px}figcaption{font-size:12px;color:#69736c;margin-bottom:8px}.axis{text-align:center;font-size:12px;color:#69736c}.transport{display:flex;gap:12px;margin-top:26px}.play{background:#2d5743;color:white;border:0;border-radius:6px;padding:13px 24px;width:100%;font-weight:500}.play[aria-pressed=true]{background:#424c46}button:focus-visible,input:focus-visible{outline:2px solid #32634e;outline-offset:4px}[hidden]{display:none!important}#error{color:#a33629;font-size:14px}@media(max-width:500px){main{margin-top:30px;padding:0 20px 28px}}
.tone-item{display:flex;align-items:center;gap:10px;margin:8px 0}.tone-item .select-tone{flex:1;text-align:left}.tone-item button{border:1px solid #d8ded9;border-radius:5px;padding:9px 12px;background:white}.tone-item button[aria-pressed=true]{background:#e4ede6;border-color:#557b64}.tone-item label{display:flex;align-items:center;gap:5px}details{border-top:1px solid #d8ded9;padding-top:18px}summary{cursor:pointer;font-weight:500}#export-parameters{font-size:14px;line-height:1.8;padding-left:22px}</style>
</head>
<body><main>
<h1>LINTS Tuner</h1>
<section aria-label="Tones"><div class="heading"><span class="label">Tones</span><div class="choices"><button id="add-tone">Add tone</button></div></div><div id="tones"></div></section>
<section aria-label="Selected tone controls"><h2 id="selected-tone" style="font-size:16px;margin-top:28px">Tone 1</h2>
<div class="row"><div class="heading"><label for="pitch">Pitch</label><div class="value"><input id="pitch-number" aria-label="Pitch in Hz" type="number" min="100" max="16000" step="1"><span>Hz</span></div></div><input id="pitch" aria-label="Pitch" type="range" min="0" max="1000" step="1"></div>
<div class="row"><div class="heading"><label for="width">Bandwidth</label><div class="value"><input id="width-number" aria-label="Bandwidth in octaves" type="number" min="0" max="3" step="0.01"><span>oct</span></div></div><input id="width" aria-label="Bandwidth" type="range" min="0" max="3" step="0.01"><div class="choices" id="width-presets"><button data-width="0">Tone</button><button data-width="0.3333333333333333">⅓ oct</button><button data-width="0.75">¾ oct</button><button data-width="1">1 oct</button></div></div>
<div class="row"><div class="heading"><label for="weight">Center weighting</label><div class="value"><input id="weight-number" aria-label="Center weighting percent" type="number" min="0" max="100" step="1"><span>%</span></div></div><input id="weight" type="range" min="0" max="100" step="1"></div>

<div class="row"><div class="heading"><label for="texture">Noise randomness</label><div class="value"><input id="texture-number" aria-label="Noise randomness percent" type="number" min="0" max="100" step="1"><span>%</span></div></div><input id="texture" type="range" min="0" max="100" step="1"><div class="heading"><span class="value">Steady</span><span class="value">Stochastic</span></div></div>
<figure><figcaption>Relative amplitude (dB)</figcaption><canvas id="spectrum" role="img" aria-label="Stimulus spectrum"></canvas><div class="axis">Frequency (Hz)</div></figure>
<div class="row"><div class="heading"><label for="volume">Volume</label><div class="value"><input id="volume-number" aria-label="Volume percent" type="number" min="0" max="100" step="1"><span>%</span></div></div><input id="volume" type="range" min="0" max="100" step="1"></div>
</section>
<div class="transport"><button id="play" class="play" aria-pressed="false">Play</button></div><p id="error" role="alert" hidden></p>
<p id="playback-status" class="value" role="status"></p>

<details class="row"><summary>Configuration</summary><ul id="export-parameters"><li>Pitch (Hz)</li><li>Bandwidth (octaves)</li><li>Center weighting (%)</li><li>Noise randomness (%)</li><li>Volume (%)</li><li>Enabled / muted</li></ul><div class="choices"><button id="export-config">Export configuration</button><button id="import-config">Import configuration</button></div>
<input id="config-file" type="file" accept=".txt,.json,text/plain,application/json" hidden>
<p id="config-status" class="value" role="status"></p></details>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id), defaults={mode:'match',pitch:4000,width:1/3,weight:0,center:4000,notch:.75,texture:100,volume:15};
const bounds={pitch:[100,16000],width:[0,3],weight:[0,100],texture:[0,100],volume:[0,100]};
const STORAGE_KEY='lints-tuner-v1';
let tones=[{...defaults,enabled:true}],selected=0,state=tones[0];
for(const key of [STORAGE_KEY,'tinnitus-matcher-standalone-v1','tinnitus-matcher-v1']){
 try{const saved=JSON.parse(localStorage.getItem(key));if(!saved||typeof saved!=='object')continue;
 if(saved.version===2){const config=parseConfiguration(JSON.stringify(saved));tones=config.tones;selected=config.selected;}
 else for(const [k,[lo,hi]] of Object.entries(bounds))if(Number.isFinite(saved[k])&&(key===STORAGE_KEY||k!=='texture'||saved.randomnessVersion===1))tones[0][k]=Math.max(lo,Math.min(hi,saved[k]));
 state=tones[selected];break;}catch{}
}
let ctx,master,analyser,voices=new Map(),playing=false,starting=false,revision=0,timer,workletReady,workletAvailable=false,steadyCache;
const EDGE_ORDER=16;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(configuration()));}catch{$('config-status').textContent='Browser storage is unavailable. Export a configuration to keep your settings.';}}
function configuration(){return {app:'LINTS Tuner',version:2,selected,tones:tones.map(t=>({...Object.fromEntries(Object.keys(bounds).map(k=>[k,t[k]])),enabled:t.enabled}))};}
function parseConfiguration(text){
 const config=JSON.parse(text);
 if(!config||config.app!=='LINTS Tuner'||![1,2].includes(config.version))throw new Error('Choose a LINTS Tuner configuration (version 1 or 2).');
 const entries=config.version===1?[config.settings]:config.tones;
 if(!Array.isArray(entries)||!entries.length||entries.length>32)throw new Error('Configuration must contain 1 to 32 tones.');
 const parsed=entries.map(entry=>{
 if(!entry||typeof entry!=='object')throw new Error('Invalid tone settings.');
 const tone={...defaults,enabled:true};
 for(const [key,[lo,hi]] of Object.entries(bounds)){
 const value=entry[key];
 if(!Number.isFinite(value)||value<lo||value>hi)throw new Error(`Invalid ${key}: expected a number from ${lo} to ${hi}.`);
 tone[key]=value;
 }
 if(config.version===2){if(typeof entry.enabled!=='boolean')throw new Error('Invalid enabled value.');tone.enabled=entry.enabled;}
 return tone;
 });
 const selection=config.version===1?0:config.selected;
 if(!Number.isInteger(selection)||selection<0||selection>=parsed.length)throw new Error('Invalid selected tone.');
 return {tones:parsed,selected:selection};
}
function renderTones(){
 const focused=document.activeElement?.id;
 $('tones').innerHTML=tones.map((tone,i)=>`<div class="tone-item"><button class="select-tone" id="select-tone-${i}" aria-pressed="${i===selected}">Tone ${i+1} (${tone.pitch} Hz)</button><label><input id="enable-tone-${i}" type="checkbox" ${tone.enabled?'checked':''} aria-label="Enable tone ${i+1}">On</label><button id="remove-tone-${i}" aria-label="Remove tone ${i+1}" ${tones.length===1?'disabled':''}>Remove</button></div>`).join('');
 tones.forEach((tone,i)=>{
 $('select-tone-'+i).onclick=()=>{selected=i;state=tone;sync();save();};
 $('enable-tone-'+i).onchange=e=>{tone.enabled=e.target.checked;sync();save();updateAudio();};
 $('remove-tone-'+i).onclick=()=>{if(tones.length===1)return;const current=state;retire(voices.get(tone));voices.delete(tone);tones.splice(i,1);selected=tones.includes(current)?tones.indexOf(current):Math.min(i,tones.length-1);state=tones[selected];sync();save();updateAudio();};
 });
 if(focused?.match(/^(select|enable|remove)-tone-/))$(focused)?.focus();
 $('add-tone').disabled=tones.length>=32;
 $('selected-tone').textContent=`Tone ${selected+1}`;
}
$('add-tone').onclick=()=>{if(tones.length>=32)return;tones.push({...defaults,enabled:true});selected=tones.length-1;state=tones[selected];sync();save();updateAudio();};
$('export-config').onclick=()=>{
 const url=URL.createObjectURL(new Blob([JSON.stringify(configuration(),null,2)+'\n'],{type:'text/plain'}));
 const link=document.createElement('a');link.href=url;link.download='lints-tuner-configuration.txt';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 $('config-status').textContent='Configuration exported.';
};
$('import-config').onclick=()=>$('config-file').click();
$('config-file').onchange=async event=>{
 const file=event.target.files[0];if(!file)return;
 try{if(file.size>65536)throw new Error('Configuration file must be smaller than 64 KB.');
 const settings=parseConfiguration(await file.text());
 stop();tones=settings.tones;selected=settings.selected;state=tones[selected];sync();save();
 $('config-status').textContent='Configuration imported.';
 }catch(error){$('config-status').textContent='Import failed: '+error.message;}
 finally{event.target.value='';}
};
function hzFromSlider(v,lo,hi){return Math.round(lo*Math.pow(hi/lo,v/1000));}
function sliderFromHz(v,lo,hi){return 1000*Math.log(v/lo)/Math.log(hi/lo);}
function sync(){
 renderTones();
 for(const [k,[lo,hi]] of Object.entries(bounds)){ $(k).value=['pitch','center'].includes(k)?sliderFromHz(state[k],lo,hi):state[k];if(document.activeElement!==$(k+'-number'))$(k+'-number').value=['width','notch'].includes(k)?Number(state[k].toFixed(2)):state[k]; }
 document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',Math.abs(Number(b.dataset.width)-state.width)<.001));
 document.querySelectorAll('[data-notch]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.notch)===state.notch));
 $('weight').disabled=$('weight-number').disabled=state.width===0;
 $('texture').disabled=$('texture-number').disabled=state.mode==='match'&&state.width===0;

 $('spectrum').setAttribute('aria-label',`Matching stimulus spectrum, centered at ${state.pitch} Hz`);
 draw();
}
function notchEdges(){const factor=2**(state.notch/2);return [state.center/factor,state.center*factor];}
function amplitude(f,tone=state){
 if(f<40||f>16000)return 0;
 if(tone.mode==='zwicker'){const d=Math.abs(Math.log2(f/tone.center))/(tone.notch/2);return -Math.expm1(-Math.LN2*Math.pow(d,EDGE_ORDER));}
 if(tone.width===0)return 0;
 const distance=Math.abs(Math.log2(f/tone.pitch))/(tone.width/2);
 return Math.exp(-Math.LN2*Math.pow(distance,EDGE_ORDER))*Math.exp(-tone.weight/100*3*distance*distance);
}
// Fixed, steep super-Gaussian edges in both modes.
function inverseFFT(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]];}}for(let len=2;len<=n;len*=2){const angle=2*Math.PI/len,wr=Math.cos(angle),wi=Math.sin(angle);for(let i=0;i<n;i+=len){let ur=1,ui=0;for(let j=0;j<len/2;j++){const a=i+j,b=a+len/2,tr=ur*re[b]-ui*im[b],ti=ur*im[b]+ui*re[b];re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;const next=ur*wr-ui*wi;ui=ur*wi+ui*wr;ur=next;}}}for(let i=0;i<n;i++)re[i]/=n;}
// A fixed multisine with eight FFT bins between components. The short,
// repeating envelope removes slow random beating; FFT windows resolve each
// component independently. This deliberately trades noise density for stability.
function steadySamples(tone=state){
 const key=[ctx.sampleRate,tone.mode,tone.pitch,tone.width,tone.weight,tone.center,tone.notch].join(':');
 if(steadyCache?.key===key)return steadyCache.data;
 const n=8192,stride=8,re=new Float64Array(n),im=new Float64Array(n),components=[];
 const centerBin=Math.round(tone.pitch*n/ctx.sampleRate);
 const offset=tone.mode==='match'?centerBin%stride:0;
 for(let k=offset||stride;k<n/2;k+=stride){const a=amplitude(k*ctx.sampleRate/n,tone);if(a>1e-8)components.push([k,a]);}
 // A narrower-than-bin passband becomes one steady component near its center.
 if(!components.length&&tone.mode==='match')components.push([centerBin,1]);
 let energy=0;for(const [,a] of components)energy+=a*a;
 let cumulative=0,phase=0;
 for(const [k,a] of components){cumulative+=a*a/(energy||1);phase+=2*Math.PI*cumulative;re[k]=re[n-k]=a*Math.cos(phase);im[k]=a*Math.sin(phase);im[n-k]=-im[k];}
 inverseFFT(re,im);let power=0,peak=0;for(const v of re){power+=v*v;peak=Math.max(peak,Math.abs(v));}
 const scale=Math.min(.16/Math.sqrt(power/n||1),.85/(peak||1));const data=Float32Array.from(re,v=>v*scale);steadyCache={key,data};return data;
}
// Fresh Gaussian spectral coefficients on every frame; equal-power overlap
// keeps stochastic playback continuous without repeating a noise recording.
class TextureProcessor extends (globalThis.AudioWorkletProcessor || class {constructor(){this.port={};}}) {
 constructor(options){super();const p=options.processorOptions;this.steady=p.steady;this.weights=p.weights;this.mix=p.mix;this.pos=0;this.cursor=0;this.n=p.weights.length*2;this.half=this.n/2;this.alive=true;this.previous=this.frame();this.current=this.frame();this.port.onmessage=e=>{if(e.data==='stop')this.alive=false;};}
 frame(){const n=this.n,re=new Float64Array(n),im=new Float64Array(n);let energy=0;
  if(this.mix===0)return re;
  for(let k=1;k<n/2;k++){const a=this.weights[k];energy+=a*a;const radius=Math.sqrt(-2*Math.log(Math.max(Number.MIN_VALUE,Math.random()))),phase=2*Math.PI*Math.random();re[k]=re[n-k]=a*radius*Math.cos(phase);im[k]=a*radius*Math.sin(phase);im[n-k]=-im[k];}
  inverseFFT(re,im);const scale=.16*n/Math.sqrt(4*energy||1);for(let i=0;i<n;i++)re[i]*=scale;return re;
 }
 process(inputs,outputs){if(!this.alive)return false;const out=outputs[0][0],a=Math.sqrt(1-this.mix),b=Math.sqrt(this.mix);
  for(let i=0;i<out.length;i++){const angle=Math.PI*this.pos/this.n,noise=this.previous[this.pos+this.half]*Math.cos(angle)+this.current[this.pos]*Math.sin(angle);out[i]=a*this.steady[this.cursor]+b*noise;this.cursor=(this.cursor+1)%this.steady.length;if(++this.pos===this.half){this.pos=0;this.previous=this.current;this.current=this.frame();}}
  return true;
 }
}
function prepareWorklet(){
 // Local-file origins can reject module loading even when AudioWorklet exists.
 if(location.protocol==='file:'||!ctx.audioWorklet||typeof AudioWorkletNode==='undefined')return Promise.resolve(false);
 if(!workletReady)workletReady=(async()=>{let url;try{
  const source=inverseFFT.toString()+'\n'+TextureProcessor.toString()+"\nregisterProcessor('noise-texture',TextureProcessor);";
  url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));await ctx.audioWorklet.addModule(url);return true;
 }catch{return false;}finally{if(url)URL.revokeObjectURL(url);}})();
 return workletReady;
}
function createNoiseSource(processorOptions){
 if(processorOptions.mix===0){const source=ctx.createBufferSource(),data=processorOptions.steady;source.buffer=ctx.createBuffer(1,data.length,ctx.sampleRate);source.buffer.getChannelData(0).set(data);source.loop=true;return source;}
 if(workletAvailable){const node=new AudioWorkletNode(ctx,'noise-texture',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[1],processorOptions});node.onprocessorerror=()=>fail(new Error('Audio processing stopped. Please press Play to restart.'));return node;}
 // Compatibility path for downloaded HTML: identical synthesis, no module load.
 const processor=new TextureProcessor({processorOptions}),node=ctx.createScriptProcessor(2048,0,1);
 node.onaudioprocess=event=>{const output=event.outputBuffer.getChannelData(0);if(!processor.process([],[[output]]))output.fill(0);};
 node.port={postMessage:()=>{processor.alive=false;node.onaudioprocess=null;}};
 return node;
}
function retire(v){if(!v)return;const now=ctx.currentTime;v.gain.gain.cancelAndHoldAtTime?.(now);v.gain.gain.linearRampToValueAtTime(0,now+.025);
 if(v.source.stop){v.source.stop(now+.03);v.source.onended=()=>{v.source.disconnect();v.gain.disconnect();};}
 else setTimeout(()=>{v.source.port.postMessage('stop');v.source.disconnect();v.gain.disconnect();},60);
}
function replaceVoice(tone=state){if(!playing)return;let source;const pure=tone.width===0;
 if(pure){source=ctx.createOscillator();source.type='sine';source.frequency.value=tone.pitch;}
 else{const weights=Float32Array.from({length:16384},(_,k)=>amplitude(k*ctx.sampleRate/32768,tone));source=createNoiseSource({steady:tone.texture===100?new Float32Array(1):steadySamples(tone),weights,mix:(tone.texture/100)**2});}
 const gain=ctx.createGain();gain.gain.value=0;source.connect(gain).connect(master);gain.gain.linearRampToValueAtTime((pure ? .16*Math.SQRT2 : 1)*(tone.volume/100)**2,ctx.currentTime+.03);source.start?.();retire(voices.get(tone));voices.set(tone,{source,gain,signature:JSON.stringify(tone)});
}
function refreshVoices(){
 if(!playing)return;
 // Average enabled signals so adding tones does not multiply output level.
 master.gain.setTargetAtTime(1/Math.max(1,tones.filter(t=>t.enabled).length),ctx.currentTime,.03);
 for(const tone of tones){const v=voices.get(tone);if(!tone.enabled){retire(v);voices.delete(tone);}else if(!v||v.signature!==JSON.stringify(tone))replaceVoice(tone);}
}
function updateAudio(){clearTimeout(timer);if(playing)timer=setTimeout(()=>{try{refreshVoices();}catch(e){fail(e);}},70);}
function stop(){revision++;starting=false;playing=false;clearTimeout(timer);for(const v of voices.values())retire(v);voices.clear();setMediaState('paused');$('playback-status').textContent='';$('play').textContent='Play';$('play').setAttribute('aria-pressed','false');draw();}
function fail(e){stop();$('error').textContent='Unable to start audio. '+e.message;$('error').hidden=false;}
function setMediaState(value){try{if(navigator.mediaSession)navigator.mediaSession.playbackState=value;}catch{}}
function playbackStatus(){
 if(!playing)return;
 const running=ctx.state==='running';setMediaState(running?'playing':'paused');
 $('playback-status').textContent=running?'Playing':'Playback was interrupted by your browser. Press Resume to continue.';
 $('play').textContent=running?'Stop':'Resume';
}
async function start(){
 if(starting)return;
 starting=true;const token=++revision;
 try{
 try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch{}
 if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();analyser=ctx.createAnalyser();analyser.fftSize=8192;master.connect(analyser).connect(ctx.destination);ctx.addEventListener('statechange',playbackStatus);}
 await ctx.resume();workletAvailable=await prepareWorklet();if(token!==revision)return;
 starting=false;playing=true;refreshVoices();
 $('play').setAttribute('aria-pressed','true');$('error').hidden=true;playbackStatus();
 }catch(e){if(token===revision)fail(e);}
}
$('play').onclick=()=>{if(starting||(playing&&ctx.state==='running'))stop();else start();};
if(navigator.mediaSession){
 try{navigator.mediaSession.metadata=new MediaMetadata({title:'LINTS Tuner',artist:'Matching stimulus'});}catch{}
 for(const [action,handler] of [['play',()=>{if(!playing||ctx.state!=='running')start();}],['pause',stop],['stop',stop]]){
 try{navigator.mediaSession.setActionHandler(action,handler);}catch{}
 }
}
// Tab visibility never stops audio. Synthesis runs in the audio rendering thread;
// the spectrum's animation can pause independently when the page is hidden.
document.addEventListener('visibilitychange',()=>{if(!document.hidden)playbackStatus();});
for(const [key,[lo,hi]] of Object.entries(bounds)){
 function change(value){state[key]=clamp(value,lo,hi);sync();save();updateAudio();}
 $(key).oninput=e=>change(['pitch','center'].includes(key)?hzFromSlider(+e.target.value,lo,hi):+e.target.value);
 $(key+'-number').oninput=e=>{if(e.target.value!==''&&e.target.validity.valid)change(+e.target.value);};
 $(key+'-number').onchange=e=>{change(Number.isFinite(e.target.valueAsNumber)?e.target.valueAsNumber:state[key]);e.target.value=Number(state[key].toFixed(2));};
}
for(const [attr,key] of [['width','width'],['notch','notch']])document.querySelectorAll('[data-'+attr+']').forEach(b=>b.onclick=()=>{state[key]=Number(b.dataset[attr]);sync();save();updateAudio();});
function draw(){const canvas=$('spectrum'),w=canvas.clientWidth,h=200,dpr=window.devicePixelRatio||1;if(canvas.width!==Math.round(w*dpr)||canvas.height!==h*dpr){canvas.width=Math.round(w*dpr);canvas.height=h*dpr;}const g=canvas.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);const left=32,right=w-12,top=10,bottom=172,x=f=>left+Math.log(f/40)/Math.log(16000/40)*(right-left),y=db=>top+clamp(-db,0,60)/60*(bottom-top);g.font='11px system-ui';g.lineWidth=1;for(const db of [0,-20,-40,-60]){g.fillStyle='#69736c';g.textAlign='right';g.fillText(db,left-7,y(db)+4);g.strokeStyle='#e0e5e0';g.beginPath();g.moveTo(left,y(db));g.lineTo(right,y(db));g.stroke();}for(const f of [100,500,1000,4000,16000]){g.textAlign='center';g.fillText(f>=1000?f/1000+'k':f,x(f),190);}g.beginPath();if(state.mode==='match'&&state.width===0){g.moveTo(x(state.pitch),bottom);g.lineTo(x(state.pitch),top);}else for(let p=0;p<=right-left;p++){const f=40*(16000/40)**(p/(right-left)),v=y(20*Math.log10(Math.max(1e-3,amplitude(f))));if(p===0)g.moveTo(left+p,v);else g.lineTo(left+p,v);}g.strokeStyle='#32634e';g.lineWidth=2;g.stroke();if(playing&&analyser){const data=new Float32Array(analyser.frequencyBinCount);analyser.getFloatFrequencyData(data);let max=-Infinity;for(const db of data)max=Math.max(max,db);if(!Number.isFinite(max))return;g.beginPath();for(let p=0;p<=right-left;p++){const f=40*400**(p/(right-left)),bin=Math.min(data.length-1,Math.round(f/ctx.sampleRate*analyser.fftSize)),v=y(data[bin]-max);if(!p)g.moveTo(left+p,v);else g.lineTo(left+p,v);}g.strokeStyle='#91ab9b';g.lineWidth=1;g.stroke();}}
let lastDraw=0;function animate(t){if(playing&&t-lastDraw>80){draw();lastDraw=t;}requestAnimationFrame(animate);}window.addEventListener('resize',draw);window.addEventListener('pagehide',()=>{stop();ctx?.suspend();});sync();save();requestAnimationFrame(animate);
</script></body></html>
